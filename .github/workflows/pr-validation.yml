name: PR validation

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Website validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Test static audit
        run: npm run test:audit

      - name: Test scene geometry
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit built routes and assets
        run: npm run audit

      - name: Install browser for release checks
        run: npx playwright install --with-deps chromium

      - name: Run browser release checks
        run: npm run test:release
